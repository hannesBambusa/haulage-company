name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A newer push cancels an older build still running, so "latest" never goes
# back to an older commit.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: stable

jobs:
  windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${V}"
          mkdir -p "$HOME/godot"
          curl -fsSL -o /tmp/godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          mv "$HOME/godot/Godot_v${V}_linux.x86_64" "$HOME/godot/godot"
          curl -fsSL -o /tmp/templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$DEST"
          mv /tmp/templates/templates/* "$DEST"/

      - name: Import project
        run: $HOME/godot/godot --headless --path . --import

      - name: Export Windows
        run: |
          mkdir -p build/windows
          $HOME/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/HaulageCompany.exe
          test -s build/windows/HaulageCompany.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaulageCompany-windows-${{ github.sha }}
          path: build/windows/HaulageCompany.exe

      # Every push to main replaces the "latest" release, so one fixed link
      # always has the newest build:
      # https://github.com/<owner>/<repo>/releases/download/latest/HaulageCompany.exe
      - name: Publish rolling "latest" release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest build/windows/HaulageCompany.exe \
            --target "$GITHUB_SHA" \
            --title "Latest build ($(date -u +%Y-%m-%d) ${GITHUB_SHA::7})" \
            --notes "Automatic build of main at ${GITHUB_SHA}: $(git log -1 --pretty=%s). Download HaulageCompany.exe and run it. Windows SmartScreen may warn because the exe is not signed: More info, Run anyway." \
            --prerelease

      - name: Publish versioned release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/HaulageCompany.exe
